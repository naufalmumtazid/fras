[project]
name = "fras"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naufalmumtazid", email = "naufalmumtazbusiness25@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "curl-cffi>=0.17.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "requests",
    "uvicorn>=0.54.0",
]

[project.scripts]
fras = "main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"


[tool.uv]
package = false
